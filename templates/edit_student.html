<html>
    <head>
        <title>Edit Student</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        {% include "_header.html" %}
        {% include "_flash_messages.html" %}
        <div class="enter-page edit-page">
            <h1>Edit Student</h1>
            <div class="userCard">
                <form method="POST">
                    <label for="name">Student name:</label>
                    <input id="name" name="name" type="text" value="{{ student['name'] }}" required>

                    <label for="email">Email:</label>
                    <input id="email" name="email" type="email" value="{{ student['email'] }}" required>

                    <label for="course">Course:</label>
                    <input id="course" name="course" type="text" value="{{ student['course'] }}" required>

                    <button type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </body>
</html>
