<!-- found about request endpoit, identifies the route im on to figure out what page is active for the header -->
<header>
    <h2>Student Management.</h2>
    <nav>
        <a
            href="{{ url_for('dashboard') }}"
            class="{% if request.endpoint == 'dashboard' %}active{% endif %}"
        >
            Dashboard
        </a>
        <a
            href="{{ url_for('students') }}"
            class="{% if request.endpoint == 'students' %}active{% endif %}"
        >
            Students
        </a>
        {% if session.get("role") == "admin" %}
            <a
                href="{{ url_for('add_student') }}"
                class="{% if request.endpoint in ['add_student', 'edit_student'] %}active{% endif %}"
            >
                Add Student
            </a>
        {% endif %}
        <a href="{{ url_for('logout') }}">Logout</a>
    </nav>
</header>
